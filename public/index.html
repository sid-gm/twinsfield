<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f12">
<title>bloop</title>
<style>
:root{--bg:#0f0f12;--panel:#17171c;--line:#2a2a33;--line2:#23232b;--text:#f2f1ee;--muted:#a3a2ab;--accent:#c6ff3d;--ink:#141a00;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding:16px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
h1{margin:0;font-size:28px;line-height:1.15;letter-spacing:-.02em;font-weight:800}
.logo{font-size:30px;font-weight:900;letter-spacing:-.04em}.logo b{color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:13px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:10px}
.btn{height:56px;border-radius:16px;border:0;background:var(--accent);color:var(--ink);font-size:17px;font-weight:800;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.light{background:var(--text);color:var(--bg)}
.btn.ghost{background:transparent;border:1px solid #3a3a44;color:var(--text)}
.btn.sm{height:44px;border-radius:12px;font-size:14px}
.icon{width:40px;height:40px;border-radius:12px;background:var(--panel);border:0;display:grid;place-items:center;flex:none;color:var(--text);text-decoration:none}
.field{height:54px;border-radius:14px;border:1px solid var(--line);background:var(--panel);padding:0 16px;font-size:17px;width:100%;outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{height:auto;min-height:84px;padding:14px 16px;resize:vertical;font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.chip{height:36px;padding:0 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;text-decoration:none;color:var(--text)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:800;color:#15151a;flex:none;border:2px solid var(--bg)}
.avs{display:flex}.avs .av+.av{margin-left:-8px}
.tpl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tpl{position:relative;border-radius:16px;overflow:hidden;background:var(--panel);aspect-ratio:9/12;border:0;padding:0;text-align:left}
.tpl img{width:100%;height:100%;object-fit:cover;display:block}
.tpl span{position:absolute;left:0;right:0;bottom:0;padding:28px 10px 10px;background:linear-gradient(transparent,#000c);font-size:14px;font-weight:700}
.tpl.add{display:grid;place-items:center;border:1.5px dashed var(--line);background:transparent;color:var(--muted);font-weight:700}
.faces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.face{border:2px solid transparent;background:var(--panel);border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;position:relative}
.face img,.face .ph{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;background:#22222a;display:grid;place-items:center;color:var(--muted)}
.face.sel{border-color:var(--accent)}
.face.off{opacity:.55}
.face em{font-style:normal;font-size:11px;color:var(--muted);font-weight:600;text-align:center}
.media{width:100%;border-radius:18px;background:#000;display:block;max-height:56dvh;object-fit:contain}
.feed-item{display:flex;flex-direction:column;gap:10px}
.feed-item video{width:100%;border-radius:18px;background:#000;max-height:70dvh}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.split3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cooking{display:flex;gap:12px;align-items:center}
.cooking img{width:56px;height:72px;border-radius:12px;object-fit:cover;flex:none;background:#22222a}
.bar{height:6px;border-radius:3px;background:#2a2a33;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;animation:slide 1.6s ease-in-out infinite;width:40%}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.strip a{flex:none;width:112px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:6px;font-size:12px}
.strip img{width:112px;height:150px;border-radius:14px;object-fit:cover;background:#22222a}
.like{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;gap:8px;padding:0 14px;font-weight:800}
.like.on{border-color:var(--accent);color:var(--accent)}
.act{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14px}
.act:last-child{border-bottom:0}
.plus{color:var(--accent)}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:28px 16px;text-align:center;color:var(--muted)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid #2a2a33;border-top-color:var(--accent);animation:sp 0.9s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.ph-frame{width:100%;aspect-ratio:9/14;border-radius:18px;background:var(--panel);display:grid;place-items:center;gap:10px;align-content:center;color:var(--muted)}
.tabs{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:12px}
.tabs button{flex:1;height:36px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:700}
.tabs button.on{background:#2a2a33;color:var(--text)}
.sheet-bg{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:480px;background:#141418;border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:92dvh;overflow:auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#3a3a44;margin:0 auto 4px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:30;max-width:90vw;text-align:center}
.toast.bad{background:var(--bad);color:#fff}
.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.3em;font-size:22px}
.link-box{font-family:ui-monospace,Menlo,monospace;font-size:14px;word-break:break-all}
.fab{margin-top:auto}
[hidden]{display:none!important}
.tpl .badge{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:999px;color:#141a00;font-style:normal;font-weight:900;font-size:12px}
.tl{position:relative;height:64px;border-radius:12px;overflow:hidden;background:#22222a;touch-action:none;user-select:none}
.tl-strip{position:absolute;inset:0;background-repeat:no-repeat}
.tl-dim{position:absolute;top:0;bottom:0;background:#0f0f12b3;pointer-events:none}.tl-dim.l{left:0}.tl-dim.r{right:0}
.tl-win{position:absolute;top:0;bottom:0;border:3px solid var(--accent);border-radius:12px;box-sizing:border-box;cursor:grab;touch-action:none}
.tl-win .h{position:absolute;top:-3px;bottom:-3px;width:22px;background:var(--accent);touch-action:none;display:grid;place-items:center}
.tl-win .h::after{content:'';width:3px;height:22px;border-radius:2px;background:#141a00}
.tl-win .h.l{left:-3px;border-radius:12px 0 0 12px}.tl-win .h.r{right:-3px;border-radius:0 12px 12px 0}
.tl-ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none}
.ov{position:relative;height:16px;border-radius:8px;background:#22222a;touch-action:none}
.ov i{position:absolute;top:3px;bottom:3px;background:var(--accent);border-radius:4px}
.ov b{position:absolute;top:0;bottom:0;border:1.5px solid #f2f1ee88;border-radius:8px}
.fr{margin:0;display:flex;flex-direction:column;gap:6px}.fr img{width:100%;height:132px;object-fit:contain;background:#000!important;border-radius:14px;background:#22222a}
.fr figcaption{font-size:12px;color:var(--muted);font-weight:700}
.ring{width:72px;height:72px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#2a2a33 0)}
.ring b{width:58px;height:58px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:24px;font-weight:900}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ======================================================================
// bloop mobile app: rooms, consent, pooled wallet. Talks to /api/rooms/*.
// Routes: /  ·  /r/<slug>  ·  /r/<slug>#pick | #who/<tpl> | #frame/<hybrid> | #result/<render> | #wallet
// ======================================================================
const $app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (c) => `${c < 0 ? '−' : ''}$${(Math.abs(c) / 100).toFixed(2)}`;
const moneyShort = (c) => (c % 100 === 0 ? `$${c / 100}` : money(c));
const ago = (iso) => { const s = Math.max(0, (Date.now() - new Date(iso)) / 1000); return s < 60 ? `${Math.round(s)}s` : s < 3600 ? `${Math.floor(s / 60)}m` : s < 86400 ? `${Math.floor(s / 3600)}h` : `${Math.floor(s / 86400)}d`; };
const store = {
  get(k, d = null) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const mem = {}; // fallback when storage is blocked
const tokenFor = (slug) => store.get(`bloop:tok:${slug}`) || mem[slug] || null;
const saveToken = (slug, token, name) => {
  mem[slug] = token; store.set(`bloop:tok:${slug}`, token);
  const rooms = store.get('bloop:rooms', []).filter((r) => r.slug !== slug);
  rooms.unshift({ slug, name }); store.set('bloop:rooms', rooms.slice(0, 20));
};
const ICON = {
  back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>',
  share: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v13M7 8l5-5 5 5M5 14v6h14v-6"/></svg>',
  heart: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.4 3.2 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5 18.8 5 21 8.4 19.5 11.8 17.5 16.4 12 21 12 21z"/></svg>',
  search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  plus: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',
};

function toast(msg, bad = false) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = `toast${bad ? ' bad' : ''}`; t.textContent = msg;
  document.body.append(t); setTimeout(() => t.remove(), 3200);
}

class ApiError extends Error { constructor(msg, status, body) { super(msg); this.status = status; this.body = body; } }
async function api(method, url, body) {
  const headers = {}; const tok = R.slug && tokenFor(R.slug);
  if (tok) headers['x-bloop-member'] = tok;
  let payload;
  if (body instanceof FormData) payload = body;
  else if (body !== undefined) { headers['content-type'] = 'application/json'; payload = JSON.stringify(body); }
  const res = await fetch(url, { method, headers, body: payload });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new ApiError(data.error || `Request failed (${res.status})`, res.status, data);
  return data;
}

// ======================================================================
// Router + state
// ======================================================================
const R = { slug: null, state: null, poll: null, view: null, templates: null };
function route() {
  cfg();
  const m = location.pathname.match(/^\/r\/([^/]+)/);
  R.slug = m ? decodeURIComponent(m[1]) : null;
  closeSheet();
  if (!R.slug) return viewStart();
  if (!tokenFor(R.slug)) return viewJoin();
  render();
}
window.addEventListener('popstate', route);
window.addEventListener('hashchange', () => { closeSheet(); render(); });
const go = (hash) => { location.hash = hash; };
const roomUrl = (slug = R.slug) => `${location.origin}/r/${encodeURIComponent(slug)}`;

async function load() {
  try { R.state = await api('GET', `/api/rooms/${R.slug}`); }
  catch (e) {
    if (e.status === 401 || e.status === 404) { store.del(`bloop:tok:${R.slug}`); delete mem[R.slug]; if (e.status === 404) { history.replaceState(null, '', '/'); } return route(); }
    throw e;
  }
}
function startPolling() {
  clearInterval(R.poll);
  R.poll = setInterval(async () => {
    if (!R.slug || !tokenFor(R.slug) || document.hidden) return;
    try { await load(); live(); } catch {}
  }, 2500);
}
// Re-render views without text inputs; views with inputs refresh only their live parts.
function live() {
  const v = R.view;
  if (document.querySelector('.sheet')) return refreshSheet?.();
  if (['home', 'frame', 'result', 'wallet'].includes(v)) render(true);
  if (v === 'who') paintFaces();
  if (v === 'check' && R.templates?.[location.hash.split('/')[1]]?.analyzing !== false) refreshCheck();
}

async function render(fromPoll = false) {
  if (!fromPoll) { if (!R.state || R.state.room.slug !== R.slug) { $app.innerHTML = '<div class="ph-frame" style="aspect-ratio:auto;height:60dvh"><span class="spin"></span></div>'; } try { await load(); } catch (e) { return toast(e.message, true); } if (!R.state) return; startPolling(); }
  const [name, arg, arg2] = (location.hash.slice(1) || 'home').split('/');
  const keepScroll = fromPoll ? scrollY : 0;
  ({ home: viewHome, pick: viewPick, trim: viewTrim, check: viewCheck, who: viewWho, frame: viewFrame, result: viewResult, wallet: viewWallet }[name] || viewHome)(arg, fromPoll, arg2);
  if (fromPoll) scrollTo(0, keepScroll); else scrollTo(0, 0);
}

// ----- helpers over state -----
const S = () => R.state;
const member = (id) => S().members.find((m) => m.id === id);
const memberName = (id) => (id === S().me.id ? 'You' : member(id)?.name || 'Someone');
const avatar = (m, size = 28) => `<span class="av" style="background:${m?.color || '#ddd'};width:${size}px;height:${size}px;font-size:${Math.round(size * 0.42)}px">${esc((m?.name || '?')[0].toUpperCase())}</span>`;
const faceImg = (f) => f?.persona?.clean_url || f?.persona?.original_url;
const header = (title, back = '#home', right = '') => `<header class="row"><a class="icon" href="${back}" aria-label="Back">${ICON.back}</a><span class="grow" style="font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(title)}</span>${right}</header>`;
const walletChip = () => `<a class="chip" href="#wallet" aria-label="Pool balance"><i></i>${money(S().room.balance_cents)}</a>`;
const busy = (btn, on, label) => { if (!btn) return; if (on) { btn.dataset.label = btn.innerHTML; btn.innerHTML = `<span class="spin"></span>${label ? ` ${esc(label)}` : ''}`; btn.disabled = true; } else { btn.innerHTML = btn.dataset.label || btn.innerHTML; btn.disabled = false; } };

// Runs an action; handles the room-level errors in one place.
async function act(btn, fn, label) {
  busy(btn, true, label);
  try { return await fn(); }
  catch (e) {
    const code = e.body?.code;
    if (code === 'low_balance') { toast(e.message, true); go('wallet'); return; }
    toast(e.message, true);
  } finally { busy(btn, false); }
}

// ======================================================================
// Start: create a room (+ rooms I'm in)
// ======================================================================
let CFG = null;
const cfg = async () => (CFG ||= await fetch('/api/settings').then((r) => r.json()).catch(() => ({})));
async function viewStart() {
  clearInterval(R.poll); R.state = null;
  const c = await cfg();
  const mine = store.get('bloop:rooms', []);
  $app.innerHTML = `
    <div class="logo" style="margin-top:20px">bloop<b>.</b></div>
    <h1>Start a room</h1>
    <div class="col">
      <input id="roomName" class="field" placeholder="Group chat name" maxlength="40" autocomplete="off">
      <input id="myName" class="field" placeholder="Your name" maxlength="30" autocomplete="given-name" value="${esc(store.get('bloop:name', ''))}">
      ${c.access_code ? `<input id="code" class="field" placeholder="Access code" maxlength="40" autocomplete="off" autocapitalize="off" value="${esc(store.get('bloop:code', ''))}">` : ''}
    </div>
    <button id="create" class="btn">Create room</button>
    ${mine.length ? `<div class="col" style="margin-top:12px"><span class="label">Your rooms</span>${mine.map((r) => `<a class="card row" style="text-decoration:none;color:var(--text);font-weight:700" href="/r/${encodeURIComponent(r.slug)}">${esc(r.name)}<span class="grow"></span><span class="muted">›</span></a>`).join('')}</div>` : ''}`;
  $app.querySelectorAll('a[href^="/r/"]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); history.pushState(null, '', a.getAttribute('href')); route(); }));
  const btn = $app.querySelector('#create');
  btn.onclick = async () => {
    const name = $app.querySelector('#roomName').value.trim(); const me = $app.querySelector('#myName').value.trim();
    if (!name) return toast('Name your room', true);
    if (!me) return toast('Add your name', true);
    store.set('bloop:name', me);
    busy(btn, true);
    try {
      const code = $app.querySelector('#code')?.value.trim();
      if (c.access_code && !code) { busy(btn, false); return toast('Add your access code', true); }
      if (code) store.set('bloop:code', code);
      const r = await api('POST', '/api/rooms', { name, creator_name: me, access_code: code });
      saveToken(r.room.slug, r.token, r.room.name);
      history.pushState(null, '', `/r/${r.room.slug}`); R.slug = r.room.slug; R.state = r;
      inviteSheet(true);
      render();
    } catch (e) { toast(e.message, true); busy(btn, false); }
  };
}

// ======================================================================
// Join (from the invite link): name only
// ======================================================================
async function viewJoin() {
  clearInterval(R.poll); R.state = null;
  $app.innerHTML = '<div class="ph-frame" style="aspect-ratio:auto;height:60dvh"><span class="spin"></span></div>';
  let p;
  try { p = await api('GET', `/api/rooms/${R.slug}/preview`); }
  catch { $app.innerHTML = `<div class="logo" style="margin-top:20px">bloop<b>.</b></div><h1>This room doesn’t exist</h1><a class="btn" href="/">Start a room</a>`; return; }
  $app.innerHTML = `
    <div class="logo" style="margin-top:20px">bloop<b>.</b></div>
    <div class="col" style="gap:14px">
      <div class="avs">${p.members.slice(0, 6).map((m) => avatar(m, 44)).join('')}</div>
      <h1>${p.invited_by ? `${esc(p.invited_by)} invited you to ` : 'Join '}${esc(p.name)}</h1>
    </div>
    ${p.recent.length ? `<div class="strip">${p.recent.map((r) => `<a><img src="${esc(r.thumb_url)}" alt=""></a>`).join('')}</div>` : ''}
    <input id="name" class="field" placeholder="Your name" maxlength="30" autocomplete="given-name" value="${esc(store.get('bloop:name', ''))}">
    <button id="join" class="btn">Join ${esc(p.name)}</button>`;
  const btn = $app.querySelector('#join');
  btn.onclick = async () => {
    const name = $app.querySelector('#name').value.trim();
    if (!name) return toast('Add your name', true);
    store.set('bloop:name', name); busy(btn, true);
    try { const r = await api('POST', `/api/rooms/${R.slug}/join`, { name }); saveToken(R.slug, r.token, r.room.name); R.state = r; render(); }
    catch (e) { toast(e.message, true); busy(btn, false); }
  };
}

// ======================================================================
// Room home
// ======================================================================
const STEP = { queued: 'In line', uploading: 'Uploading', generating: 'Cooking', compositing: 'Finishing', finishing: 'Finishing', analyzing: 'Reading the template' };
function renderStatus(r) {
  if (r.queue_position != null && r.queue_position > 0 && !r.started_at) return `#${r.queue_position} in line`;
  return STEP[r.status] || 'Cooking';
}
function viewHome() {
  R.view = 'home';
  const s = S(); const me = s.me;
  const cooking = s.renders.filter((r) => !['done', 'failed', 'preview_ready'].includes(r.status));
  const done = s.renders.filter((r) => r.status === 'done' && r.output_url);
  const used = new Set(s.renders.map((r) => r.hybrid_id));
  const drafts = s.drafts.filter((h) => !used.has(h.id) && h.status !== 'failed');
  const asks = s.faces.filter((f) => f.kind === 'member' && f.status === 'pending' && f.subject_member_id === me.id);
  $app.innerHTML = `
    <header class="row">
      <div class="grow col" style="gap:4px"><span style="font-size:22px;font-weight:900;letter-spacing:-.02em">${esc(s.room.name)}</span>

// Link → trimmer (TikTok, YouTube, Instagram, X, Reddit…). The server grabs 2 minutes from the start time.
function linkSheet(prefill) {
  openSheet(`
    <h2 style="margin:0;font-size:22px">Paste a link</h2>
    <div class="row" style="gap:8px"><input id="u" class="field grow" type="url" inputmode="url" placeholder="https://…" value="${esc(prefill)}" autocomplete="off">
      ${navigator.clipboard?.readText ? '<button class="btn ghost sm" id="paste" style="width:auto;padding:0 14px">Paste</button>' : ''}</div>
    <div class="col" style="gap:8px"><label class="small muted" for="st">Start at</label><input id="st" class="field" inputmode="numeric" placeholder="0:00" maxlength="8"></div>
    <button class="btn" id="ok">Get the video</button>`, (el) => {
    const u = el.querySelector('#u'); const st = el.querySelector('#st'); const ok = el.querySelector('#ok');
    if (!prefill) u.focus();
    el.querySelector('#paste')?.addEventListener('click', async () => { try { u.value = (await navigator.clipboard.readText()).trim(); } catch { toast('Couldn’t read the clipboard', true); } });
    ok.onclick = () => act(ok, async () => {
      let url = u.value.trim(); if (!url) throw new Error('Paste a link');
      if (!/^https?:\/\//i.test(url)) url = `https://${url}`;
      const src = await api('POST', `/api/rooms/${R.slug}/sources/link`, { url, start: st.value.trim() || undefined });
      closeSheet(); go(`trim/${src.id}`);
    }, 'Grabbing the clip…');

}

async function getTemplate(id) {
  if (R.templates?.[id]) return R.templates[id];
  for (const scope of ['', 'room']) {
    const rows = await api('GET', `/api/rooms/${R.slug}/templates${scope ? `?scope=${scope}` : ''}`);
    R.templates = Object.fromEntries([...Object.entries(R.templates || {}), ...rows.map((t) => [t.id, t])]);
    if (R.templates[id]) return R.templates[id];
  }
  return null;
}

// ======================================================================
// Trim: pick start/end on a longer video (upload or link), see first/last frame
// ======================================================================
const fmtT = (s) => { s = Math.max(0, s); const m = Math.floor(s / 60); const r = s - m * 60; return `${m}:${r < 10 ? '0' : ''}${r.toFixed(1)}`; };
async function viewTrim(srcId, fromPoll, replaces) {
  R.view = 'trim';
  let src, prev = null;
  try {
    src = await api('GET', `/api/rooms/${R.slug}/sources/${srcId}`);
    if (replaces) prev = await api('GET', `/api/rooms/${R.slug}/templates/${replaces}`).catch(() => null);
  } catch (e) { toast(e.message, true); return go('pick'); }
  const dur = src.duration_s, MIN = src.min_s, MAX = src.max_s;
  const sel = prev?.source_trim ? { ...prev.source_trim } : { start: 0, end: Math.min(dur, MAX) };
  const span = Math.min(dur, 30); let vs = 0; // zoomed viewport [vs, vs + span]
  const frameUrl = (t) => `/api/rooms/${R.slug}/sources/${src.id}/frame?t=${(Math.round(t * 10) / 10).toFixed(1)}`;
  $app.innerHTML = `
    ${header(src.title, '#pick')}
    <video id="pv" class="media" style="max-height:42dvh" src="${esc(src.preview_url)}" playsinline muted autoplay preload="auto"></video>
    <div class="row"><b id="len" style="font-size:18px"></b><span class="small muted" id="rng"></span><span class="grow"></span>
      <button class="icon" id="snd" aria-label="Sound">🔇</button><button class="icon" id="play" aria-label="Play">❚❚</button></div>
    ${dur > span ? `<div class="ov" id="ov"><i id="ovSel"></i><b id="ovView"></b></div>` : ''}
    <div class="tl" id="tl"><div class="tl-strip" id="strip"></div><div class="tl-dim l" id="dimL"></div><div class="tl-dim r" id="dimR"></div>
      <div class="tl-win" id="win"><span class="h l" id="hl"></span><span class="h r" id="hr"></span></div><i class="tl-ph" id="ph"></i></div>
    <div class="split"><figure class="fr"><img id="f1" alt=""><figcaption>First frame</figcaption></figure><figure class="fr"><img id="f2" alt=""><figcaption>Last frame</figcaption></figure></div>
    <button class="btn" id="ok">Check this template</button>`;
  const v = $app.querySelector('#pv'), tl = $app.querySelector('#tl'), strip = $app.querySelector('#strip');
  const win = $app.querySelector('#win'), ph = $app.querySelector('#ph');
  const f1 = $app.querySelector('#f1'), f2 = $app.querySelector('#f2');
  strip.style.backgroundImage = `url('${src.strip_url}')`;
  const W = () => tl.clientWidth;
  const x = (t) => ((t - vs) / span) * W();
  const keepInView = () => {
    if (sel.start < vs) vs = Math.max(0, sel.start - 1);
    if (sel.end > vs + span) vs = Math.min(dur - span, sel.end - span + 1);
    vs = Math.max(0, Math.min(dur - span, vs));
  };
  const paint = () => {
    if (!tl.isConnected) return;
    keepInView();
    const w = W(), total = (w * dur) / span;
    strip.style.backgroundSize = `${total}px 100%`; strip.style.backgroundPosition = `${-(vs / span) * w}px 0`;
    win.style.left = `${x(sel.start)}px`; win.style.width = `${x(sel.end) - x(sel.start)}px`;
    $app.querySelector('#dimL').style.width = `${Math.max(0, x(sel.start))}px`;
    $app.querySelector('#dimR').style.left = `${x(sel.end)}px`;
    $app.querySelector('#len').textContent = `${(sel.end - sel.start).toFixed(1)}s`;
    $app.querySelector('#rng').textContent = `${fmtT(sel.start + src.offset_s)} – ${fmtT(sel.end + src.offset_s)}`;
    const ov = $app.querySelector('#ov');
    if (ov) { const k = ov.clientWidth / dur; Object.assign($app.querySelector('#ovSel').style, { left: `${sel.start * k}px`, width: `${Math.max(3, (sel.end - sel.start) * k)}px` }); Object.assign($app.querySelector('#ovView').style, { left: `${vs * k}px`, width: `${span * k}px` }); }
  };
  let fTimer;
  const frames = () => { clearTimeout(fTimer); fTimer = setTimeout(() => { f1.src = frameUrl(sel.start); f2.src = frameUrl(Math.max(sel.start, sel.end - 0.1)); }, 120); };
  // Loop playback inside the selection.
  let raf; const loop = () => {
    if (!v.paused && (v.currentTime >= sel.end - 0.04 || v.currentTime < sel.start - 0.25)) v.currentTime = sel.start;
    ph.style.left = `${x(v.currentTime)}px`; ph.hidden = v.currentTime < vs || v.currentTime > vs + span;
    if (R.view === 'trim' && v.isConnected) raf = requestAnimationFrame(loop); else v.pause();
  };
  v.addEventListener('loadedmetadata', () => { v.currentTime = sel.start; v.play().catch(() => {}); });
  const playBtn = $app.querySelector('#play');
  v.onplay = () => (playBtn.textContent = '❚❚'); v.onpause = () => (playBtn.textContent = '▶');
  playBtn.onclick = () => { if (v.paused) { if (v.currentTime >= sel.end - 0.05) v.currentTime = sel.start; v.play(); } else v.pause(); };
  $app.querySelector('#snd').onclick = (e) => { v.muted = !v.muted; e.currentTarget.textContent = v.muted ? '🔇' : '🔊'; if (v.paused) v.play(); };
  // Drag: left handle, right handle, or the whole window.
  const drag = (el, mode) => el.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation(); el.setPointerCapture(e.pointerId);
    const x0 = e.clientX, s0 = { ...sel }; const wasPlaying = !v.paused; v.pause();
    const move = (ev) => {
      const dt = ((ev.clientX - x0) / W()) * span;
      if (mode === 'l') sel.start = Math.max(0, Math.max(s0.end - MAX, Math.min(s0.start + dt, s0.end - MIN)));
      else if (mode === 'r') sel.end = Math.min(dur, Math.min(s0.start + MAX, Math.max(s0.end + dt, s0.start + MIN)));
      else { const len = s0.end - s0.start; sel.start = Math.max(0, Math.min(dur - len, s0.start + dt)); sel.end = sel.start + len; }
      v.currentTime = mode === 'r' ? sel.end - 0.05 : sel.start;
      paint();
    };
    const up = () => { el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); v.currentTime = sel.start; if (wasPlaying || mode !== 'r') v.play().catch(() => {}); frames(); };
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
  drag($app.querySelector('#hl'), 'l'); drag($app.querySelector('#hr'), 'r'); drag(win, 'move');
  // Tap the strip outside the window: move the window there.
  tl.addEventListener('pointerdown', (e) => {
    if (e.target !== tl && !e.target.classList.contains('tl-strip') && !e.target.classList.contains('tl-dim')) return;
    const t = vs + ((e.clientX - tl.getBoundingClientRect().left) / W()) * span; const len = sel.end - sel.start;
    sel.start = Math.max(0, Math.min(dur - len, t - len / 2)); sel.end = sel.start + len; v.currentTime = sel.start; paint(); frames();
  });
  // Overview (long videos): drag to jump anywhere.
  const ov = $app.querySelector('#ov');
  if (ov) {
    const jump = (e) => { const t = ((e.clientX - ov.getBoundingClientRect().left) / ov.clientWidth) * dur; const len = sel.end - sel.start; sel.start = Math.max(0, Math.min(dur - len, t - len / 2)); sel.end = sel.start + len; vs = Math.max(0, Math.min(dur - span, sel.start - (span - len) / 2)); v.currentTime = sel.start; paint(); };
    ov.addEventListener('pointerdown', (e) => { ov.setPointerCapture(e.pointerId); jump(e); const mv = (ev) => jump(ev); const end = () => { ov.removeEventListener('pointermove', mv); frames(); }; ov.addEventListener('pointermove', mv); ov.addEventListener('pointerup', end, { once: true }); });
  }
  window.addEventListener('resize', paint);
  paint(); frames(); raf = requestAnimationFrame(loop);
  const ok = $app.querySelector('#ok');
  ok.onclick = () => act(ok, async () => {
    v.pause();
    const t = await api('POST', `/api/rooms/${R.slug}/sources/${src.id}/template`, { start: +sel.start.toFixed(2), end: +sel.end.toFixed(2), replaces: replaces || undefined });
    (R.templates ||= {})[t.id] = t; go(`check/${t.id}`);
  }, 'Making it…');
}

function faceState(f) {
  const p = f.persona;
  if (f.status === 'pending') return `Waiting for ${f.label}`;

  if (p.status !== 'done') return 'Getting ready…';
  return '';

function paintFaces() {

  if (picked && !faces.some((f) => f.id === picked && !faceState(f))) picked = null;
  // Nothing chosen yet: preselect my selfie, else the newest ready face.
  if (!picked && !userPicked) { const ready = faces.filter((f) => !faceState(f)); picked = (ready.find((f) => f.kind === 'self' && f.added_by === S().me.id) || ready[ready.length - 1])?.id || null; }
  box.innerHTML = faces.length ? faces.map((f) => {
    const st = faceState(f); const img = faceImg(f);
    return `<button class="face${picked === f.id ? ' sel' : ''}${st ? ' off' : ''}" data-f="${f.id}">${img ? `<img src="${esc(img)}" alt="">` : '<div class="ph"><span class="spin"></span></div>'}<span>${esc(f.kind === 'self' && f.added_by === S().me.id ? 'You' : f.label)}</span>${st ? `<em>${esc(st)}</em>` : ''}</button>`;
  }).join('') : `<div class="empty" style="grid-column:1/-1">No faces yet</div>`;
  box.querySelectorAll('[data-f]').forEach((b) => b.onclick = () => {
    const f = faces.find((x) => x.id === b.dataset.f); const st = faceState(f);
    if (st) { toast(st); return; }
    picked = picked === f.id ? null : f.id; userPicked = true; paintFaces();
  });
  const go1 = $app.querySelector('#go');
  if (go1 && !go1.querySelector('.spin')) {
    go1.disabled = !picked;
    const name = faces.find((f) => f.id === picked);
    go1.textContent = picked ? `Make frame 1 with ${name.kind === 'self' && name.added_by === S().me.id ? 'you' : name.label}` : faces.some((f) => !faceState(f)) ? 'Tap a face' : faces.length ? 'Getting faces ready…' : 'Add a face first';
  }
}
async function uploadFace(file, fields, btn) {
  const fd = new FormData(); fd.append('image', file);
  for (const [k, v] of Object.entries(fields)) fd.append(k, v);
  return act(btn, async () => {
    const f = await api('POST', `/api/rooms/${R.slug}/faces`, fd);
    await load(); if (f.status === 'approved') picked = f.id;
    closeSheet(); paintFaces();
    if (f.status === 'pending') toast(`Sent to ${f.label} to approve`);
  });
}
function addSomeoneSheet() {
  const others = S().members.filter((m) => m.id !== S().me.id);
  openSheet(`
    <h2 style="margin:0;font-size:22px">Add someone</h2>
    <div class="faces">${others.map((m) => `<button class="face" data-m="${m.id}">${avatar(m, 56)}<span>${esc(m.name)}</span></button>`).join('')}
      <button class="face" data-pet="1"><div class="ph" style="font-size:28px">🐾</div><span>A pet</span></button></div>
    <div id="petBox" class="col" hidden><input id="petName" class="field" placeholder="Pet’s name" maxlength="30"></div>
    <button class="btn ghost" id="invite">Not here? Invite them</button>
    <input id="f" type="file" accept="image/*" hidden>`, (el) => {
    const file = el.querySelector('#f'); let fields = null; let btn = null;
    el.querySelectorAll('[data-m]').forEach((b) => b.onclick = () => { fields = { kind: 'member', subject_member_id: b.dataset.m }; btn = b; file.click(); });
    el.querySelector('[data-pet]').onclick = (e) => {
      const box = el.querySelector('#petBox'); const name = el.querySelector('#petName');
      if (box.hidden) { box.hidden = false; name.focus(); return; }
      fields = { kind: 'pet', label: name.value.trim() || 'Pet' }; btn = e.currentTarget; file.click();
    };
    el.querySelector('#petName').onkeydown = (e) => { if (e.key === 'Enter') el.querySelector('[data-pet]').click(); };
    el.querySelector('#invite').onclick = () => { closeSheet(); inviteSheet(); };
    file.onchange = () => file.files[0] && uploadFace(file.files[0], fields, btn);
  });
}

// ======================================================================
// Frame 1 (the hybrid still): room likes, try again, tweak, make video
// ======================================================================
function viewFrame(id) {
  R.view = 'frame';
  const s = S(); const h = s.drafts.find((x) => x.id === id);
  if (!h) { $app.innerHTML = `${header('Frame 1')}<div class="empty">This draft is gone</div>`; return; }
  const price = h.template?.price_cents ?? 0;
  const liked = h.likes.includes(s.me.id);
  const r = s.renders.find((x) => x.hybrid_id === h.id);
  const limit = s.room.daily_limit; const left = limit ? Math.max(0, limit - s.me.renders_today) : null;
  $app.innerHTML = `
    ${header(h.template?.title || 'Frame 1', '#home', walletChip())}
    ${h.status === 'done' ? `<img class="media" src="${esc(h.image_url)}" alt="Frame 1">`
      : h.status === 'failed' ? `<div class="ph-frame"><b style="color:var(--text)">That didn’t work</b><span class="small" style="padding:0 24px;text-align:center">${esc(h.error || '')}</span></div>`
      : `<div class="ph-frame"><span class="spin"></span><span>${h.status === 'analyzing' ? 'Reading the template…' : 'Making frame 1…'}</span><span class="small">${ago(h.created_at)}</span></div>`}
    <div class="row">${avatar(member(h.created_by))}<span class="grow small"><b>${esc(memberName(h.created_by))}</b> <span class="muted">· ${esc(h.face?.label || '')}${h.notes ? ` · “${esc(h.notes)}”` : ''}</span></span>
      <button class="like${liked ? ' on' : ''}" id="like">${ICON.heart}${h.likes.length || ''}</button></div>
    ${h.likes.length ? `<div class="row small muted"><span class="avs">${h.likes.map((m) => avatar(member(m), 22)).join('')}</span>${h.likes.map(memberName).join(', ')}</div>` : ''}
    <div class="split"><button class="btn ghost sm" id="again" ${['done', 'failed'].includes(h.status) ? '' : 'disabled'}>Try again</button><button class="btn ghost sm" id="tweak" ${['done', 'failed'].includes(h.status) ? '' : 'disabled'}>Tweak</button></div>
    ${r ? `<a class="btn fab" href="#result/${r.id}">See the video</a>`
      : `<div class="col fab" style="gap:8px"><button class="btn" id="make" ${h.status === 'done' && left !== 0 ? '' : 'disabled'}>Make video · ${moneyShort(price)}</button>
         <span class="small muted" style="text-align:center">${left === 0 ? 'Daily limit reached' : `From ${esc(s.room.name)}’s pool${left != null ? ` · ${left} left today` : ''}`}</span></div>`}`;
  $app.querySelector('#like').onclick = (e) => act(e.currentTarget, async () => { R.state = await api('POST', `/api/rooms/${R.slug}/hybrids/${h.id}/like`); render(true); });
  const redo = (btn, notes) => act(btn, async () => {
    const n = await api('POST', `/api/rooms/${R.slug}/hybrids`, { template_id: h.template_id, face_id: h.face_id, notes });
    await load(); closeSheet(); go(`frame/${n.id}`);
  });
  $app.querySelector('#again').onclick = (e) => redo(e.currentTarget, h.notes || '');
  $app.querySelector('#tweak').onclick = () => openSheet(`
    <h2 style="margin:0;font-size:22px">Tweak</h2>
    <textarea id="n" class="field" maxlength="300" placeholder="e.g. bigger ears, keep the sunglasses">${esc(h.notes || '')}</textarea>
    <button class="btn" id="ok">Make frame 1</button>`, (el) => { el.querySelector('#n').focus(); el.querySelector('#ok').onclick = (e) => redo(e.currentTarget, el.querySelector('#n').value); });
  $app.querySelector('#make')?.addEventListener('click', (e) => act(e.currentTarget, async () => {
    const rr = await api('POST', `/api/rooms/${R.slug}/renders`, { hybrid_id: h.id });
    await load(); go(`result/${rr.id}`);
  }));
}

// ======================================================================
// Result + share
// ======================================================================
const ENGINE_NAME = { kling: 'Kling O3', seedance: 'Seedance 2.5' };
const ENGINE_ORDER = ['seedance', 'kling'];
function viewResult(id) {
  R.view = 'result';
  const s = S(); const r = s.renders.find((x) => x.id === id);
  if (!r) { $app.innerHTML = `${header('Meme')}<div class="empty">Not found</div>`; return; }
  const doneV = r.status === 'done' && r.output_url;
  const started = r.started_at ? ` · ${ago(r.started_at)} in` : '';
  $app.innerHTML = `
    ${header(r.template?.title || 'Meme')}
    ${doneV ? `<video class="media" src="${esc(r.output_url)}" playsinline controls autoplay loop></video>`
      : r.status === 'failed' ? `<div class="ph-frame" style="aspect-ratio:auto;padding:28px 0"><b style="color:var(--text)">That one failed</b><span class="small" style="padding:0 24px;text-align:center">${esc(r.error || '')}</span>${r.refunded ? `<span class="plus small">${money(r.price_cents)} back in the pool</span>` : ''}</div>`
      : `<div class="ph-frame" style="background:center/cover no-repeat url('${esc(r.hybrid?.image_url || '')}')"><div class="card col" style="background:#0f0f12e6;align-items:center;gap:8px;min-width:200px"><span class="spin"></span><b>${renderStatus(r)}</b><span class="small muted">${ago(r.created_at)}${started}</span><div class="bar" style="width:100%"><i></i></div></div></div>`}
    <div class="row">${avatar(member(r.created_by))}<span class="grow small"><b>${esc(memberName(r.created_by))}</b> <span class="muted">· ${esc(r.face?.label || '')} · ${esc(ENGINE_NAME[r.engine] || '')} · ${r.price_cents ? money(r.price_cents) : ''}</span></span></div>
    ${doneV ? `<div class="col fab" style="gap:8px"><button class="btn" id="share">${ICON.share} Send to the chat</button><div class="split"><button class="btn ghost sm" id="remix">Remix</button><a class="btn ghost sm" href="#pick">Make another</a></div></div>`
      : r.status === 'failed' ? `<div class="col fab" style="gap:8px"><span class="label">Try another model</span>
          ${[...ENGINE_ORDER].sort((a, b) => (a === r.engine) - (b === r.engine)).map((e) => `<button class="btn${e === r.engine ? ' ghost' : ''}" data-engine="${e}">${e === r.engine ? `Retry ${ENGINE_NAME[e]}` : ENGINE_NAME[e]} · ${moneyShort(r.template?.prices?.[e] ?? 0)}</button>`).join('')}
          <a class="btn ghost sm" href="#frame/${r.hybrid_id}">Back to frame 1</a></div>` : ''}`;
  $app.querySelectorAll('[data-engine]').forEach((b) => b.onclick = () => act(b, async () => {
    const rr = await api('POST', `/api/rooms/${R.slug}/renders`, { hybrid_id: r.hybrid_id, engine: b.dataset.engine });
    await load(); go(`result/${rr.id}`);
  }));
  $app.querySelector('#share')?.addEventListener('click', (e) => shareRender(r, e.currentTarget));
  $app.querySelector('#remix')?.addEventListener('click', () => remixSheet(r.id));
}

async function shareRender(r, btn) {
  if (!r?.output_url) return;
  busy(btn, true);
  try {
    const blob = await (await fetch(r.output_url)).blob();
    const file = new File([blob], `bloop-${(r.template?.title || 'meme').replace(/[^\w-]+/g, '-').toLowerCase()}.mp4`, { type: 'video/mp4' });
    if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file] }); }
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('Saved. Drop it in the chat'); }
  } catch (e) { if (e.name !== 'AbortError') toast('Couldn’t share that', true); }
  finally { busy(btn, false); }
}

function remixSheet(renderId) {
  openSheet(`
    <h2 style="margin:0;font-size:22px">Remix</h2>
    <input id="t" class="field" placeholder="Who gets swapped? e.g. the tabby cat" maxlength="200">
    <button class="btn" id="ok">Next</button>`, (el) => {
    const t = el.querySelector('#t'); t.focus();
    el.querySelector('#ok').onclick = (e) => act(e.currentTarget, async () => {
      if (!t.value.trim()) throw new Error('Say who gets swapped');
      const tpl = await api('POST', `/api/rooms/${R.slug}/renders/${renderId}/remix`, { target: t.value.trim() });
      (R.templates ||= {})[tpl.id] = tpl; closeSheet(); go(`check/${tpl.id}`);
    });
  });
}

function viewWallet() {
  R.view = 'wallet';
  const s = S(); const limit = s.room.daily_limit;
  const kindText = (l) => ({ topup: `${memberName(l.member_id)} added`, trial: 'Free trial', render: `${memberName(l.member_id)} made “${l.note || 'a meme'}”`, refund: 'Refund · render failed' }[l.kind] || l.note || l.kind);
  $app.innerHTML = `
    ${header(`${s.room.name}’s pool`)}
    <section class="card col" style="gap:14px;padding:18px">
      <div class="col" style="gap:4px"><span class="small muted">Balance</span><span style="font-size:44px;font-weight:800;letter-spacing:-.03em">${money(s.room.balance_cents)}</span></div>
      ${CFG?.test_topups === false ? '' : `<div class="split3">${[500, 1000, 2000].map((c) => `<button class="btn sm" data-top="${c}">+ ${moneyShort(c)}</button>`).join('')}</div>`}
    </section>
    <section class="col"><span class="label">Chipped in</span>
      <div class="strip">${s.contributions.map((c) => `<div class="card col" style="flex:none;min-width:96px;gap:2px;padding:10px"><span class="small muted">${esc(memberName(c.member_id))}</span><b style="font-size:18px">${moneyShort(c.cents)}</b></div>`).join('')}</div></section>
    <section class="col" style="gap:0"><span class="label" style="margin-bottom:6px">Activity</span>
      ${s.ledger.length ? s.ledger.map((l) => `<div class="act"><span>${esc(kindText(l))}</span><span class="${l.amount_cents > 0 ? 'plus' : 'muted'}" style="white-space:nowrap">${l.amount_cents > 0 ? '+' : ''}${money(l.amount_cents)}</span></div>`).join('') : '<span class="muted small">Nothing yet</span>'}</section>
    <section class="card row" style="padding:12px 14px">
      <span class="grow col" style="gap:2px"><b style="font-size:14px">Daily limit per person</b><span class="small muted">${limit ? `${limit} meme${limit === 1 ? '' : 's'} a day each` : 'Off'}</span></span>
      <button class="icon" data-lim="-1" aria-label="Fewer">−</button><b style="min-width:20px;text-align:center">${limit || '∞'}</b><button class="icon" data-lim="1" aria-label="More">+</button>
    </section>`;
  $app.querySelectorAll('[data-top]').forEach((b) => b.onclick = () => act(b, async () => {
    R.state = await api('POST', `/api/rooms/${R.slug}/topup`, { amount_cents: Number(b.dataset.top) });
    toast(`Added ${moneyShort(Number(b.dataset.top))}`); render(true);
  }));
  $app.querySelectorAll('[data-lim]').forEach((b) => b.onclick = () => act(b, async () => {
    const next = Math.max(0, Math.min(20, (limit || 0) + Number(b.dataset.lim)));
    R.state = await api('PATCH', `/api/rooms/${R.slug}`, { daily_limit: next }); render(true);
  }));
}

// ======================================================================
// Sheets: invite
// ======================================================================
let refreshSheet = null;
function openSheet(html, mount) {
  closeSheet();
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog"><div class="grab"></div>${html}</div>`;
  bg.onclick = (e) => { if (e.target === bg) closeSheet(); };
  document.body.append(bg); mount?.(bg.querySelector('.sheet'));
}
function closeSheet() { document.querySelector('.sheet-bg')?.remove(); refreshSheet = null; }

function inviteSheet(fresh = false) {
  const url = roomUrl(); const name = S()?.room.name || 'the room';
  openSheet(`
    <h2 style="margin:0;font-size:24px">${fresh ? `${esc(name)} is ready` : `Invite to ${esc(name)}`}</h2>
    <div class="card link-box">${esc(url)}</div>
    <div class="split"><button class="btn ghost sm" id="copy">Copy link</button><button class="btn sm" id="send">${ICON.share} Send</button></div>
    ${fresh ? '<button class="btn light" id="done">Open room</button>' : ''}`, (el) => {
    el.querySelector('#copy').onclick = async () => { try { await navigator.clipboard.writeText(url); toast('Link copied'); } catch { toast(url); } };
    el.querySelector('#send').onclick = async () => {
      if (navigator.share) { try { await navigator.share({ title: `bloop · ${name}`, text: `Join ${name} on bloop`, url }); } catch {} }
      else { try { await navigator.clipboard.writeText(url); toast('Link copied'); } catch { toast(url); } }
    };
    el.querySelector('#done')?.addEventListener('click', closeSheet);
  });
}

route();
